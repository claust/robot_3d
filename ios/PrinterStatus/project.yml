name: PrinterStatus
options:
  bundleIdPrefix: dk.delectosoft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # The protocol layer shared with the macOS app — MQTT decode, TLS trust,
  # SSDP discovery, the simulated source. It owns the MQTTNIO and SwiftNIO
  # dependencies, so this project does not declare them itself.
  BambuKit:
    path: ../../shared/BambuKit
targets:
  PrinterStatus:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: BambuKit
        product: BambuKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Printer Status
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # MQTT (TCP 8883) and SSDP (UDP 2021) both go to the printer's LAN
        # address, which iOS gates behind the Local Network permission.
        # Without this key the first connect silently fails.
        NSLocalNetworkUsageDescription: >-
          Printer Status connects to your Bambu Lab printer on your local
          network to show its live state.
        # TLS to the printer is Apple's own stack — exempt, and answering in
        # the bundle keeps every TestFlight build out of "Missing Compliance".
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.delectosoft.printerstatus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # DEVELOPMENT_TEAM comes from the environment (CI) or Xcode's own
        # signing UI; simulator builds need neither.
        CODE_SIGN_STYLE: Automatic
